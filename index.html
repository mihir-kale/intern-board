<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intern Board</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #dfe1e6;
      --text: #172b4d;
      --muted: #5e6c84;
      --accent: #0052cc;
      --not-started: #97a0af;
      --started: #00b8d9;
      --complete: #36b37e;
      --shadow: 0 1px 2px rgba(9, 30, 66, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout {
      display: flex;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .main { flex: 1 1 auto; min-width: 0; }
    .side { flex: 0 0 280px; }

    /* Header */
    .topbar {
      background: var(--accent);
      color: #fff;
      padding: 14px 24px;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar button {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
    }
    .topbar button:hover { background: rgba(255,255,255,0.3); }

    /* Tag toggles */
    .tagbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 14px;
      align-items: center;
    }
    .tagbar .label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .tag {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s ease;
    }
    .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Columns */
    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    .column {
      background: #ebecf0;
      border-radius: 8px;
      max-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
    }
    .col-head {
      padding: 12px 14px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .col-head .dot { width: 10px; height: 10px; border-radius: 50%; }
    .col-head .count { color: var(--muted); font-weight: 600; }
    .col-body { padding: 8px; overflow-y: auto; flex: 1 1 auto; }
    .empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }

    /* Card */
    .card {
      background: var(--card);
      border-radius: 6px;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left: 4px solid var(--not-started);
      transition: transform 0.1s ease;
    }
    .card[data-status="started"] { border-left-color: var(--started); }
    .card[data-status="complete"] { border-left-color: var(--complete); }
    .card:hover { transform: translateY(-1px); }
    .card .title { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .card .meta { font-size: 12px; color: var(--muted); }
    .card .meta .row { margin: 3px 0; }
    .card .due { font-size: 12px; font-weight: 600; }
    .card .due.overdue { color: #de350b; }
    .card .intern { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--text); }
    .card a { color: var(--accent); text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .card-actions button {
      flex: 1; border: 1px solid var(--border); background: var(--bg);
      color: var(--text); border-radius: 4px; padding: 5px; font-size: 12px; cursor: pointer;
    }
    .card-actions button:hover { background: #dfe1e6; }
    .card-actions button.del:hover { background: #ffebe6; border-color: #de350b; color: #de350b; }

    /* Side / location */
    .side-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 14px;
      padding: 14px;
    }
    .side-box h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--muted); }
    .loc-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .loc-row:last-child { border-bottom: none; }
    .loc-name { flex: 1 1 auto; font-weight: 600; font-size: 14px; }
    .loc-status { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
    .loc-remote { background: #e3fcef; color: #0b875b; }
    .loc-office { background: #deebff; color: #0747a6; }
    .loc-next { background: #ffe380; color: #7a5b00; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(9,30,66,0.5);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 8px; width: 440px; max-width: 94vw;
      max-height: 92vh; overflow-y: auto; padding: 22px;
    }
    .modal h2 { margin: 0 0 16px 0; font-size: 18px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .field .req { color: #de350b; }
    .field .hint { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; font-family: inherit;
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button {
      padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
    .btn-danger { background: #de350b; color: #fff; border-color: #de350b !important; }
    .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pills .tag { width: auto; }
    .hidden { display: none !important; }
    .conn-error {
      background: #ffebe6; color: #de350b; border: 1px solid #de350b;
      padding: 10px 16px; border-radius: 6px; margin: 16px 0 0 16px; font-size: 14px;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .side { flex: 1 1 auto; }
      .columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    Intern Board
    <button id="newTicketBtn">+ New Ticket</button>
  </header>

  <div class="layout">
    <div class="main">
      <div class="conn-error hidden" id="connError"></div>

      <div class="tagbar" id="tagbar">
        <span class="label">Filter:</span>
        <span class="tag active" data-intern="ALL">All</span>
      </div>

      <div class="columns" id="columns">
        <div class="column" data-status="not_started">
          <div class="col-head">
            <span class="dot" style="background:var(--not-started)"></span>
            NOT STARTED <span class="count" data-count="not_started"></span>
          </div>
          <div class="col-body" data-body="not_started"></div>
        </div>
        <div class="column" data-status="started">
          <div class="col-head">
            <span class="dot" style="background:var(--started)"></span>
            STARTED <span class="count" data-count="started"></span>
          </div>
          <div class="col-body" data-body="started"></div>
        </div>
        <div class="column" data-status="complete">
          <div class="col-head">
            <span class="dot" style="background:var(--complete)"></span>
            COMPLETE <span class="count" data-count="complete"></span>
          </div>
          <div class="col-body" data-body="complete"></div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="side-box">
        <h3>LOCATION STATUS</h3>
        <div id="locList"></div>
      </div>
      <div class="side-box">
        <h3>TICKET STATUS LEGEND</h3>
        <div class="loc-row"><span class="loc-status loc-office">In Office</span><span>On site</span></div>
        <div class="loc-row"><span class="loc-status loc-remote">Remote</span><span>Working remote</span></div>
        <div class="loc-row"><span class="loc-status loc-next">Next Time</span><span>Next visit</span></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">New Ticket</h2>
      <input type="hidden" id="fId" />
      <div class="field">
        <label>Title <span class="req">*</span></label>
        <input id="fTitle" placeholder="Ticket title" />
      </div>
      <div class="field">
        <label>Due Date <span class="req">*</span></label>
        <input id="fDue" type="date" />
      </div>
      <div class="field">
        <label>Assigned Intern <span class="req">*</span></label>
        <select id="fIntern"></select>
      </div>
      <div class="field">
        <label>Assignee <span class="hint">(optional, free text)</span></label>
        <input id="fAssignee" placeholder="e.g. external contact" />
      </div>

      <div class="field">
        <label>Hyperlink 1 <span class="hint">(optional)</span></label>
        <input id="fLink1" type="url" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Hyperlink 1 Title <span class="hint">(optional)</span></label>
        <input id="fLinkTitle1" placeholder="Display text" />
      </div>
      <div class="field">
        <label>Hyperlink 2 <span class="hint">(optional)</span></label>
        <input id="fLink2" type="url" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Hyperlink 2 Title <span class="hint">(optional)</span></label>
        <input id="fLinkTitle2" placeholder="Display text" />
      </div>

      <div class="field">
        <label>Notes <span class="hint">(optional)</span></label>
        <textarea id="fNotes" placeholder="Notes (commonly handled by the hyperlinked file)"></textarea>
      </div>
      <div class="field">
        <label>Status</label>
        <div class="status-pills" id="statusPills">
          <span class="tag" data-status="not_started">Not Started</span>
          <span class="tag" data-status="started">Started</span>
          <span class="tag" data-status="complete">Complete</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="deleteBtn" class="btn-danger hidden">Delete</button>
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — edit these
    // ============================================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    // Hard-coded interns: name -> default location ("remote" | "office" | "next")
    const INTERNS = {
      'Lydia Love':  'remote',
      'Mihir Kale':  'office',
      'Colin Tierney': 'next',
      'Eli Bright':  'remote',
    };
    // A toggle per intern, plus "All". Edit the list above to change names.
    // ============================================================
    // END CONFIG
    // ============================================================

    const STATUS_ORDER = ['not_started', 'started', 'complete'];
    const STATUS_LABEL = { not_started: 'Not Started', started: 'Started', complete: 'Complete' };
    const LOC_LABEL = { remote: 'Remote', office: 'In Office', next: 'Next Time' };

    let client = null;
    let tickets = [];
    let activeIntern = 'ALL';
    let editingId = null;
    let modalStatus = 'not_started';

    const $ = (id) => document.getElementById(id);

    // ---------- Supabase ----------
    async function init() {
      if (!SUPABASE_URL.startsWith('http')) {
        $('connError').textContent = 'Supabase not configured. Put your URL and anon key in the CONFIG block at the top of index.html.';
        $('connError').classList.remove('hidden');
        return;
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      renderTags();
      renderLoc();
      await loadTickets();
      client
        .channel('tickets-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => loadTickets())
        .subscribe();
    }

    async function loadTickets() {
      try {
        const { data, error } = await client.from('tickets').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        tickets = data || [];
        render();
      } catch (e) {
        $('connError').textContent = 'Failed to load tickets: ' + e.message;
        $('connError').classList.remove('hidden');
      }
    }

    // ---------- Render ----------
    function renderTags() {
      const bar = $('tagbar');
      for (const name of Object.keys(INTERNS)) {
        const t = document.createElement('span');
        t.className = 'tag';
        t.dataset.intern = name;
        t.textContent = name;
        t.onclick = () => {
          activeIntern = name;
          bar.querySelectorAll('.tag').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          render();
        };
        bar.appendChild(t);
      }
    }

    function renderLoc() {
      const list = $('locList');
      list.innerHTML = '';
      for (const [name, loc] of Object.entries(INTERNS)) {
        const row = document.createElement('div');
        row.className = 'loc-row';
        const cls = loc === 'office' ? 'loc-office' : loc === 'next' ? 'loc-next' : 'loc-remote';
        row.innerHTML =
          `<span class="loc-status ${cls}">${LOC_LABEL[loc]}</span>` +
          `<span class="loc-name">${name}</span>`;
        list.appendChild(row);
      }
    }

    function visibleCards() {
      return activeIntern === 'ALL'
        ? tickets
        : tickets.filter(t => t.intern === activeIntern);
    }

    function render() {
      const visible = visibleCards();
      for (const status of STATUS_ORDER) {
        const body = $(`columns`).querySelector(`[data-body="${status}"]`);
        const countEl = $('columns').querySelector(`[data-count="${status}"]`);
        const cards = visible.filter(t => t.status === status);
        countEl.textContent = cards.length;
        body.innerHTML = '';
        if (!cards.length) {
          body.innerHTML = '<div class="empty">No tickets</div>';
          continue;
        }
        cards.sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
        for (const t of cards) body.appendChild(renderCard(t));
      }
    }

    function renderCard(t) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.status = t.status;
      card.onclick = () => openEdit(t);

      const today = new Date();
      today.setHours(0,0,0,0);
      const due = t.due_date ? new Date(t.due_date + 'T00:00:00') : null;
      const overdue = due && t.status !== 'complete' && due < today;

      let links = '';
      if (t.hyperlink_1) links += `<div class="row"><a href="${escapeHtml(t.hyperlink_1)}" target="_blank" rel="noopener">${escapeHtml(t.hyperlink_title_1 || t.hyperlink_1)}</a></div>`;
      if (t.hyperlink_2) links += `<div class="row"><a href="${escapeHtml(t.hyperlink_2)}" target="_blank" rel="noopener">${escapeHtml(t.hyperlink_title_2 || t.hyperlink_2)}</a></div>`;

      card.innerHTML =
        `<div class="title">${escapeHtml(t.title)}</div>` +
        `<div class="meta">` +
          `<div class="row due ${overdue ? 'overdue' : ''}">Due: ${escapeHtml(t.due_date || '—')}${overdue ? ' (overdue)' : ''}</div>` +
          (t.intern ? `<div class="row"><span class="intern">${escapeHtml(t.intern)}</span></div>` : '') +
          (t.assignee ? `<div class="row">Assignee: ${escapeHtml(t.assignee)}</div>` : '') +
          links +
          (t.notes ? `<div class="row">${escapeHtml(t.notes)}</div>` : '') +
        `</div>` +
        `<div class="card-actions">` +
          `<button data-move="prev" type="button">◀ ${STATUS_LABEL[STATUS_ORDER[Math.max(0, STATUS_ORDER.indexOf(t.status)-1)]]}</button>` +
          `<button data-move="next" type="button">${STATUS_LABEL[STATUS_ORDER[Math.min(2, STATUS_ORDER.indexOf(t.status)+1)]]} ▶</button>` +
        `</div>`;

      card.querySelector('[data-move="prev"]').onclick = (e) => { e.stopPropagation(); move(t, -1); };
      card.querySelector('[data-move="next"]').onclick = (e) => { e.stopPropagation(); move(t, 1); };
      return card;
    }

    // ---------- Actions ----------
    async function move(t, dir) {
      const idx = STATUS_ORDER.indexOf(t.status);
      const next = STATUS_ORDER[Math.min(2, Math.max(0, idx + dir))];
      if (next === t.status) return;
      await client.from('tickets').update({ status: next }).eq('id', t.id);
    }

    function openEdit(t) {
      editingId = t ? t.id : null;
      $('modalTitle').textContent = t ? 'Edit Ticket' : 'New Ticket';
      $('fId').value = t ? t.id : '';
      $('fTitle').value = t ? t.title : '';
      $('fDue').value = t ? t.due_date : '';
      $('fIntern').value = t ? t.intern : Object.keys(INTERNS)[0];
      $('fAssignee').value = t ? (t.assignee || '') : '';
      $('fLink1').value = t ? (t.hyperlink_1 || '') : '';
      $('fLinkTitle1').value = t ? (t.hyperlink_title_1 || '') : '';
      $('fLink2').value = t ? (t.hyperlink_2 || '') : '';
      $('fLinkTitle2').value = t ? (t.hyperlink_title_2 || '') : '';
      $('fNotes').value = t ? (t.notes || '') : '';
      modalStatus = t ? t.status : 'not_started';
      setStatusPill();
      $('deleteBtn').classList.toggle('hidden', !t);
      $('overlay').classList.add('open');
    }

    function setStatusPill() {
      document.querySelectorAll('#statusPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.status === modalStatus);
      });
    }

    async function save() {
      const title = $('fTitle').value.trim();
      const due = $('fDue').value;
      if (!title) { alert('Title is required.'); return; }
      if (!due) { alert('Due date is required.'); return; }

      const payload = {
        title,
        due_date: due,
        intern: $('fIntern').value,
        assignee: $('fAssignee').value.trim() || null,
        hyperlink_1: $('fLink1').value.trim() || null,
        hyperlink_title_1: $('fLinkTitle1').value.trim() || null,
        hyperlink_2: $('fLink2').value.trim() || null,
        hyperlink_title_2: $('fLinkTitle2').value.trim() || null,
        notes: $('fNotes').value.trim() || null,
        status: modalStatus,
      };

      if (editingId) {
        await client.from('tickets').update(payload).eq('id', editingId);
      } else {
        await client.from('tickets').insert(payload);
      }
      $('overlay').classList.remove('open');
    }

    async function remove() {
      if (!editingId) return;
      if (!confirm('Delete this ticket?')) return;
      await client.from('tickets').delete().eq('id', editingId);
      $('overlay').classList.remove('open');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    // ---------- Wire up ----------
    $('newTicketBtn').onclick = () => openEdit(null);
    $('cancelBtn').onclick = () => $('overlay').classList.remove('open');
    $('saveBtn').onclick = save;
    $('deleteBtn').onclick = remove;

    document.querySelectorAll('#statusPills .tag').forEach(p => {
      p.onclick = () => { modalStatus = p.dataset.status; setStatusPill(); };
    });

    // populate intern select
    const sel = $('fIntern');
    for (const name of Object.keys(INTERNS)) {
      const o = document.createElement('option');
      o.value = name;
      o.textContent = name;
      sel.appendChild(o);
    }

    init();
  </script>
</body>
</html>
