<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intern Board</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #101310;
      --bg-2: #151a15;
      --card: #0d100d;
      --panel: #141914;
      --border: #2b352b;
      --text: #c8d6c8;
      --muted: #6f8070;
      --accent: #33ff66;
      --accent-dim: #1f7a3a;
      --assigned: #7d8a7d;
      --in-progress: #33ff66;
      --complete: #ffb000;
      --warn: #ff5a3c;
      --shadow: 0 0 0 1px rgba(51,255,102,0.06), 0 0 18px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SFMono-Regular", ui-monospace, "Cascadia Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(51,255,102,0.05), transparent 60%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px);
      min-height: 100vh;
    }
    .layout {
      display: flex;
      gap: 14px;
      padding: 14px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .main { flex: 1 1 auto; min-width: 0; }
    .side { flex: 0 0 280px; }

    /* Header */
    .topbar {
      background: var(--bg-2);
      color: var(--accent);
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .topbar::before { content: "▮"; color: var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .topbar button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.1s, color 0.1s;
    }
    .topbar button:hover { background: var(--accent); color: #06100a; }

    /* Tag toggles */
    .tagbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      margin-top: 14px;
      align-items: center;
    }
    .tagbar .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .tag {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .tag:hover { color: var(--text); border-color: var(--accent); }
    .tag.active { background: var(--accent); border-color: var(--accent); color: #06100a; }

    /* Columns */
    .columns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 14px;
    }
    .columns.show-completed {
      grid-template-columns: repeat(3, 1fr);
    }
    .column {
      background: var(--panel);
      border: 1px solid var(--border);
      max-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
    }
    .col-head {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .col-head .dot { width: 8px; height: 8px; background: currentColor; }
    .col-head .count { color: var(--accent); font-weight: 700; margin-left: auto; }
    .col-body { padding: 8px; overflow-y: auto; flex: 1 1 auto; }
    .empty { color: var(--muted); font-size: 12px; padding: 12px; text-align: center; font-style: italic; }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--assigned);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .card:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }
    .card[data-status="in_progress"] { border-left-color: var(--in-progress); }
    .card[data-status="complete"] { border-left-color: var(--complete); }
    .card .title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: var(--text); }
    .card .meta { font-size: 11px; color: var(--muted); }
    .card .meta .row { margin: 2px 0; }
    .card .due { font-size: 11px; font-weight: 700; color: var(--muted); }
    .card .due.overdue { color: var(--warn); }
    .card .intern { display: inline-block; background: transparent; border: 1px solid var(--border); padding: 1px 6px; font-size: 11px; color: var(--accent); }
    .card a { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; }
    .card a:hover { color: var(--complete); }
    .card-actions { display: flex; gap: 6px; margin-top: 10px; }
    .card-actions button {
      flex: 1; border: 1px solid var(--border); background: transparent;
      color: var(--muted); padding: 4px; font-family: inherit; font-size: 11px; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .card-actions button:hover { background: var(--accent); border-color: var(--accent); color: #06100a; }
    .card-actions button.del:hover { background: var(--warn); border-color: var(--warn); color: #1a0500; }

    /* Expandable status updates */
    .card .latest {
      font-size: 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 6px 8px;
      margin: 8px 0 0 0;
    }
    .card .latest .w { display: block; margin-top: 2px; color: var(--muted); }
    .card .expand {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      margin-top: 8px;
      user-select: none;
    }
    .card .expand:hover { text-decoration: underline; }
    .card .expanded { display: none; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
    .card.open .expanded { display: block; }
    .history { margin-bottom: 12px; }
    .history .h-empty { color: var(--muted); font-size: 12px; font-style: italic; }
    .history .h-item {
      font-size: 12px;
      padding: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent-dim);
      margin-bottom: 6px;
    }
    .history .h-date { font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .history .h-text { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .update-form .f-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
    .update-form input[type="date"], .update-form textarea {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
    }
    .update-form textarea { resize: vertical; min-height: 70px; }
    .update-form .word-count { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }
    .update-form .word-count.over { color: var(--warn); font-weight: 700; }
    .update-form .add-btn {
      margin-top: 8px;
      width: 100%;
      padding: 6px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .update-form .add-btn:hover { background: var(--accent); color: #06100a; }
    .update-form .add-btn:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; background: transparent; }

    /* Side / location */
    .side-box {
      background: var(--panel);
      border: 1px solid var(--border);
      margin-top: 14px;
      padding: 12px;
    }
    .side-box h3 { margin: 0 0 12px 0; font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    .loc-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .loc-row:last-child { border-bottom: none; }
    .loc-name { flex: 1 1 auto; font-weight: 700; font-size: 13px; color: var(--text); }
    .loc-status { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border: 1px solid; }
    .loc-remote { border-color: var(--accent); color: var(--accent); }
    .loc-office { border-color: #33aaff; color: #33aaff; }
    .loc-next { border-color: var(--complete); color: var(--complete); }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--accent-dim); width: 440px; max-width: 94vw;
      max-height: 92vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 16px 0; font-size: 15px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field .req { color: var(--warn); }
    .field .hint { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 7px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-family: inherit; font-size: 13px;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button {
      padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--text);
      font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .modal-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent) !important; color: #06100a !important; border-color: var(--accent) !important; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger { background: var(--warn) !important; color: #1a0500 !important; border-color: var(--warn) !important; }
    .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pills .tag { width: auto; }
    .completed-toggle {
      margin-left: auto;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .completed-toggle:hover { color: var(--text); border-color: var(--complete); }
    .completed-toggle.active { background: var(--complete); border-color: var(--complete); color: #1a1200; }
    .column.completed-col { display: none; }
    .columns.show-completed .column.completed-col { display: flex; }
    .hidden { display: none !important; }
    .conn-error {
      background: rgba(255,90,60,0.1); color: var(--warn); border: 1px solid var(--warn);
      padding: 10px 16px; margin: 14px 0 0 0; font-size: 13px;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .side { flex: 1 1 auto; }
      .columns, .columns.show-completed { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    Intern Board
    <button id="newTicketBtn">+ New Ticket</button>
  </header>

  <div class="layout">
    <div class="main">
      <div class="conn-error hidden" id="connError"></div>

      <div class="tagbar" id="tagbar">
        <span class="label">Filter:</span>
        <span class="tag active" data-intern="ALL">All</span>
        <button class="completed-toggle" id="completedToggle">Show Completed</button>
      </div>

      <div class="columns" id="columns">
        <div class="column" data-status="assigned">
          <div class="col-head">
            <span class="dot" style="background:var(--assigned)"></span>
            ASSIGNED <span class="count" data-count="assigned"></span>
          </div>
          <div class="col-body" data-body="assigned"></div>
        </div>
        <div class="column" data-status="in_progress">
          <div class="col-head">
            <span class="dot" style="background:var(--in-progress)"></span>
            IN PROGRESS <span class="count" data-count="in_progress"></span>
          </div>
          <div class="col-body" data-body="in_progress"></div>
        </div>
        <div class="column completed-col" data-status="complete">
          <div class="col-head">
            <span class="dot" style="background:var(--complete)"></span>
            COMPLETED <span class="count" data-count="complete"></span>
          </div>
          <div class="col-body" data-body="complete"></div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="side-box">
        <h3>LOCATION STATUS</h3>
        <div id="locList"></div>
      </div>
      <div class="side-box">
        <h3>TICKET STATUS LEGEND</h3>
        <div class="loc-row"><span class="loc-status loc-office">In Office</span><span>On site</span></div>
        <div class="loc-row"><span class="loc-status loc-remote">Remote</span><span>Working remote</span></div>
        <div class="loc-row"><span class="loc-status loc-next">Next Time</span><span>Next visit</span></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">New Ticket</h2>
      <input type="hidden" id="fId" />
      <div class="field">
        <label>Title <span class="req">*</span></label>
        <input id="fTitle" placeholder="Ticket title" />
      </div>
      <div class="field">
        <label>Due Date <span class="req">*</span></label>
        <input id="fDue" type="date" />
      </div>
      <div class="field">
        <label>Assigned Intern <span class="req">*</span></label>
        <select id="fIntern"></select>
      </div>
      <div class="field">
        <label>Assignee <span class="hint">(optional, free text)</span></label>
        <input id="fAssignee" placeholder="e.g. external contact" />
      </div>

      <div class="field">
        <label>Hyperlink 1 <span class="hint">(optional)</span></label>
        <input id="fLink1" type="url" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Hyperlink 1 Title <span class="hint">(optional)</span></label>
        <input id="fLinkTitle1" placeholder="Display text" />
      </div>
      <div class="field">
        <label>Hyperlink 2 <span class="hint">(optional)</span></label>
        <input id="fLink2" type="url" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Hyperlink 2 Title <span class="hint">(optional)</span></label>
        <input id="fLinkTitle2" placeholder="Display text" />
      </div>

      <div class="field">
        <label>Notes <span class="hint">(optional)</span></label>
        <textarea id="fNotes" placeholder="Notes (commonly handled by the hyperlinked file)"></textarea>
      </div>
      <div class="field">
        <label>Status</label>
        <div class="status-pills" id="statusPills">
          <span class="tag" data-status="assigned">Assigned</span>
          <span class="tag" data-status="in_progress">In Progress</span>
          <span class="tag" data-status="complete">Completed</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="deleteBtn" class="btn-danger hidden">Delete</button>
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — edit these
    // ============================================================
    const SUPABASE_URL = 'https://gvvajesgltbaakxnqzbs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2dmFqZXNnbHRiYWFreG5xemJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzIyOTksImV4cCI6MjEwMzk0ODI5OX0.XVmxmuaVFiHUCHWs0D133on7rLFwoSIIUpqU4nTFYVY';

    // Hard-coded interns: name -> default location ("remote" | "office" | "next")
    const INTERNS = {
      'Lydia Love':  'remote',
      'Mihir Kale':  'office',
      'Colin Tierney': 'next',
      'Eli Bright':  'remote',
    };
    // A toggle per intern, plus "All". Edit the list above to change names.
    // ============================================================
    // END CONFIG
    // ============================================================

    const STATUS_ORDER = ['assigned', 'in_progress', 'complete'];
    const STATUS_LABEL = { assigned: 'Assigned', in_progress: 'In Progress', complete: 'Completed' };
    const LOC_LABEL = { remote: 'Remote', office: 'In Office', next: 'Next Time' };

    let client = null;
    let tickets = [];
    let activeIntern = 'ALL';
    let editingId = null;
    let modalStatus = 'assigned';

    const $ = (id) => document.getElementById(id);

    // ---------- Supabase ----------
    async function init() {
      if (!SUPABASE_URL.startsWith('http')) {
        $('connError').textContent = 'Supabase not configured. Put your URL and anon key in the CONFIG block at the top of index.html.';
        $('connError').classList.remove('hidden');
        return;
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      renderTags();
      renderLoc();
      await loadTickets();
      client
        .channel('tickets-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => loadTickets())
        .subscribe();
    }

    async function loadTickets() {
      try {
        const { data, error } = await client.from('tickets').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        tickets = data || [];
        await attachLatestUpdates();
        render();
      } catch (e) {
        $('connError').textContent = 'Failed to load tickets: ' + e.message;
        $('connError').classList.remove('hidden');
      }
    }

    async function attachLatestUpdates() {
      if (!tickets.length) return;
      const ids = tickets.map(t => t.id);
      const { data, error } = await client.from('status_updates')
        .select('ticket_id, update_date, body')
        .in('ticket_id', ids);
      if (error) return;
      const latest = {};
      for (const u of data || []) {
        const cur = latest[u.ticket_id];
        if (!cur || u.update_date > cur.update_date) latest[u.ticket_id] = u;
      }
      for (const t of tickets) t._latest = latest[t.id] || null;
    }

    // ---------- Render ----------
    function renderTags() {
      const bar = $('tagbar');
      for (const name of Object.keys(INTERNS)) {
        const t = document.createElement('span');
        t.className = 'tag';
        t.dataset.intern = name;
        t.textContent = name;
        t.onclick = () => {
          activeIntern = name;
          bar.querySelectorAll('.tag').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          render();
        };
        bar.appendChild(t);
      }
    }

    function renderLoc() {
      const list = $('locList');
      list.innerHTML = '';
      for (const [name, loc] of Object.entries(INTERNS)) {
        const row = document.createElement('div');
        row.className = 'loc-row';
        const cls = loc === 'office' ? 'loc-office' : loc === 'next' ? 'loc-next' : 'loc-remote';
        row.innerHTML =
          `<span class="loc-status ${cls}">${LOC_LABEL[loc]}</span>` +
          `<span class="loc-name">${name}</span>`;
        list.appendChild(row);
      }
    }

    function visibleCards() {
      return activeIntern === 'ALL'
        ? tickets
        : tickets.filter(t => t.intern === activeIntern);
    }

    function render() {
      const visible = visibleCards();
      for (const status of STATUS_ORDER) {
        const body = $(`columns`).querySelector(`[data-body="${status}"]`);
        const countEl = $('columns').querySelector(`[data-count="${status}"]`);
        const cards = visible.filter(t => t.status === status);
        countEl.textContent = cards.length;
        body.innerHTML = '';
        if (!cards.length) {
          body.innerHTML = '<div class="empty">No tickets</div>';
          continue;
        }
        cards.sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
        for (const t of cards) body.appendChild(renderCard(t));
      }
    }

    function renderCard(t) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.status = t.status;
      card.onclick = (e) => { if (!e.target.closest('.expand, .add-btn, .history, .update-form')) openEdit(t); };

      const today = new Date();
      today.setHours(0,0,0,0);
      const due = t.due_date ? new Date(t.due_date + 'T00:00:00') : null;
      const overdue = due && t.status !== 'complete' && due < today;

      let links = '';
      if (t.hyperlink_1) links += `<div class="row"><a href="${escapeHtml(t.hyperlink_1)}" target="_blank" rel="noopener">${escapeHtml(t.hyperlink_title_1 || t.hyperlink_1)}</a></div>`;
      if (t.hyperlink_2) links += `<div class="row"><a href="${escapeHtml(t.hyperlink_2)}" target="_blank" rel="noopener">${escapeHtml(t.hyperlink_title_2 || t.hyperlink_2)}</a></div>`;

      const latest = t._latest;

      card.innerHTML =
        `<div class="title">${escapeHtml(t.title)}</div>` +
        `<div class="meta">` +
          `<div class="row due ${overdue ? 'overdue' : ''}">Due: ${escapeHtml(t.due_date || '—')}${overdue ? ' (overdue)' : ''}</div>` +
          (t.intern ? `<div class="row"><span class="intern">${escapeHtml(t.intern)}</span></div>` : '') +
          (t.assignee ? `<div class="row">Assignee: ${escapeHtml(t.assignee)}</div>` : '') +
          links +
          (t.notes ? `<div class="row">${escapeHtml(t.notes)}</div>` : '') +
        `</div>` +
        (latest
          ? `<div class="latest"><span class="d">${escapeHtml(latest.update_date)}</span><span class="w">${escapeHtml(previewWords(latest.body, 20))}</span></div>`
          : '') +
        `<div class="expand">▸ Status updates</div>` +
        `<div class="expanded">` +
          `<div class="history h-${t.id}"></div>` +
          `<div class="update-form">` +
            `<label class="f-label">Date <span class="req">*</span></label>` +
            `<input type="date" class="u-date" />` +
            `<label class="f-label">Update <span class="req">*</span> <span class="hint">(up to 400 words)</span></label>` +
            `<textarea class="u-body" placeholder="What did you work on?"></textarea>` +
            `<div class="word-count">0 / 400 words</div>` +
            `<button class="add-btn" type="button">Add update</button>` +
          `</div>` +
        `</div>` +
        `<div class="card-actions">` +
          `<button data-move="prev" type="button">◀ ${STATUS_LABEL[STATUS_ORDER[Math.max(0, STATUS_ORDER.indexOf(t.status)-1)]]}</button>` +
          `<button data-move="next" type="button">${STATUS_LABEL[STATUS_ORDER[Math.min(2, STATUS_ORDER.indexOf(t.status)+1)]]} ▶</button>` +
        `</div>`;

      const expandEl = card.querySelector('.expand');
      expandEl.onclick = (e) => {
        e.stopPropagation();
        const open = card.classList.toggle('open');
        expandEl.innerHTML = open ? '▾ Status updates' : '▸ Status updates';
        if (open && !card.dataset.loaded) {
          card.dataset.loaded = '1';
          loadUpdates(t, card);
        }
      };

      const dateInput = card.querySelector('.u-date');
      const bodyInput = card.querySelector('.u-body');
      const countEl = card.querySelector('.word-count');
      const addBtn = card.querySelector('.add-btn');
      dateInput.value = today.toISOString().slice(0, 10);

      const countWords = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);
      const refreshCount = () => {
        const n = countWords(bodyInput.value);
        countEl.textContent = `${n} / 400 words`;
        countEl.classList.toggle('over', n > 400);
        addBtn.disabled = n === 0 || n > 400 || !dateInput.value;
      };
      bodyInput.addEventListener('input', refreshCount);
      dateInput.addEventListener('change', refreshCount);
      refreshCount();

      addBtn.onclick = (e) => {
        e.stopPropagation();
        addUpdate(t, dateInput.value, bodyInput.value, card);
      };

      card.querySelector('[data-move="prev"]').onclick = (e) => { e.stopPropagation(); move(t, -1); };
      card.querySelector('[data-move="next"]').onclick = (e) => { e.stopPropagation(); move(t, 1); };
      return card;
    }

    function previewWords(text, max) {
      const words = text.trim().split(/\s+/);
      if (words.length <= max) return text.trim();
      return words.slice(0, max).join(' ') + '…';
    }

    // ---------- Status updates ----------
    async function loadUpdates(t, card) {
      try {
        const { data, error } = await client.from('status_updates')
          .select('*')
          .eq('ticket_id', t.id)
          .order('update_date', { ascending: false });
        if (error) throw error;
        renderHistory(card.querySelector('.history'), data || []);
      } catch (e) {
        card.querySelector('.history').innerHTML = '<div class="h-empty">Failed to load updates.</div>';
      }
    }

    function renderHistory(container, updates) {
      container.innerHTML = '';
      if (!updates.length) {
        container.innerHTML = '<div class="h-empty">No status updates yet.</div>';
        return;
      }
      for (const u of updates) {
        const item = document.createElement('div');
        item.className = 'h-item';
        item.innerHTML = `<div class="h-date">${escapeHtml(u.update_date)}</div><div class="h-text">${escapeHtml(u.body)}</div>`;
        container.appendChild(item);
      }
    }

    async function addUpdate(t, update_date, body, card) {
      try {
        const { error } = await client.from('status_updates').insert({ ticket_id: t.id, update_date, body: body.trim() });
        if (error) throw error;
        bodyInputValue(card, '');
        await Promise.all([loadUpdates(t, card), loadTickets()]);
      } catch (e) {
        alert('Failed to add update: ' + e.message);
      }
    }

    function bodyInputValue(card, v) {
      const b = card.querySelector('.u-body');
      b.value = v;
      b.dispatchEvent(new Event('input'));
    }

    // ---------- Actions ----------
    async function move(t, dir) {
      const idx = STATUS_ORDER.indexOf(t.status);
      const next = STATUS_ORDER[Math.min(2, Math.max(0, idx + dir))];
      if (next === t.status) return;
      await client.from('tickets').update({ status: next }).eq('id', t.id);
    }

    function openEdit(t) {
      editingId = t ? t.id : null;
      $('modalTitle').textContent = t ? 'Edit Ticket' : 'New Ticket';
      $('fId').value = t ? t.id : '';
      $('fTitle').value = t ? t.title : '';
      $('fDue').value = t ? t.due_date : '';
      $('fIntern').value = t ? t.intern : Object.keys(INTERNS)[0];
      $('fAssignee').value = t ? (t.assignee || '') : '';
      $('fLink1').value = t ? (t.hyperlink_1 || '') : '';
      $('fLinkTitle1').value = t ? (t.hyperlink_title_1 || '') : '';
      $('fLink2').value = t ? (t.hyperlink_2 || '') : '';
      $('fLinkTitle2').value = t ? (t.hyperlink_title_2 || '') : '';
      $('fNotes').value = t ? (t.notes || '') : '';
      modalStatus = t ? t.status : 'assigned';
      setStatusPill();
      $('deleteBtn').classList.toggle('hidden', !t);
      $('overlay').classList.add('open');
    }

    function setStatusPill() {
      document.querySelectorAll('#statusPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.status === modalStatus);
      });
    }

    async function save() {
      const title = $('fTitle').value.trim();
      const due = $('fDue').value;
      if (!title) { alert('Title is required.'); return; }
      if (!due) { alert('Due date is required.'); return; }

      const payload = {
        title,
        due_date: due,
        intern: $('fIntern').value,
        assignee: $('fAssignee').value.trim() || null,
        hyperlink_1: $('fLink1').value.trim() || null,
        hyperlink_title_1: $('fLinkTitle1').value.trim() || null,
        hyperlink_2: $('fLink2').value.trim() || null,
        hyperlink_title_2: $('fLinkTitle2').value.trim() || null,
        notes: $('fNotes').value.trim() || null,
        status: modalStatus,
      };

      if (editingId) {
        await client.from('tickets').update(payload).eq('id', editingId);
      } else {
        await client.from('tickets').insert(payload);
      }
      $('overlay').classList.remove('open');
    }

    async function remove() {
      if (!editingId) return;
      if (!confirm('Delete this ticket?')) return;
      await client.from('tickets').delete().eq('id', editingId);
      $('overlay').classList.remove('open');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    // ---------- Wire up ----------
    $('newTicketBtn').onclick = () => openEdit(null);
    $('cancelBtn').onclick = () => $('overlay').classList.remove('open');
    $('saveBtn').onclick = save;
    $('deleteBtn').onclick = remove;

    $('completedToggle').onclick = () => {
      const cols = $('columns');
      const btn = $('completedToggle');
      cols.classList.toggle('show-completed');
      const showing = cols.classList.contains('show-completed');
      btn.classList.toggle('active', showing);
      btn.textContent = showing ? 'Hide Completed' : 'Show Completed';
    };

    document.querySelectorAll('#statusPills .tag').forEach(p => {
      p.onclick = () => { modalStatus = p.dataset.status; setStatusPill(); };
    });

    // populate intern select
    const sel = $('fIntern');
    for (const name of Object.keys(INTERNS)) {
      const o = document.createElement('option');
      o.value = name;
      o.textContent = name;
      sel.appendChild(o);
    }

    init();
  </script>
</body>
</html>
